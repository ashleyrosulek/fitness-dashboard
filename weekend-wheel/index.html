<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekend Wheel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:ital,wght@0,500;0,700;0,800;1,500&display=swap">
<style>
  /* Layout: boardwalk prize booth. Wheel on the left as the hero, the ticket-stub control panel on the right; stacks on phones. */
  :root {
    --bg: #f6efe1;
    --bg-2: #efe4cf;
    --fg: #2b2118;
    --muted: #7a6a58;
    --line: #d9c9ad;
    --panel: #fffaf0;
    --accent: #c8442b;
    --accent-fg: #ffffff;
    --gold: #e0a92d;
    --hub: #fff5d6;
    --shadow: 0 18px 40px rgba(70, 40, 10, .18);
    --seg-1: #d9533a;
    --seg-2: #f2b134;
    --seg-3: #2a9d8f;
    --seg-4: #e76f51;
    --seg-5: #3a86c8;
    --seg-6: #8ab17d;
    --seg-7: #b5651d;
    --seg-8: #6a4c93;
    --seg-text: #fffdf7;
    --font-display: "Alfa Slab One", "Rockwell", "Georgia", serif;
    --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1612; --bg-2: #231d17; --fg: #f3e9d8; --muted: #b8a890; --line: #3d3328;
      --panel: #2a221b; --accent: #e9603f; --accent-fg: #1b1612; --gold: #f0c04a; --hub: #3a2f23;
      --shadow: 0 18px 40px rgba(0, 0, 0, .5); --seg-text: #fffdf7; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1612; --bg-2: #231d17; --fg: #f3e9d8; --muted: #b8a890; --line: #3d3328;
    --panel: #2a221b; --accent: #e9603f; --accent-fg: #1b1612; --gold: #f0c04a; --hub: #3a2f23;
    --shadow: 0 18px 40px rgba(0, 0, 0, .5); --seg-text: #fffdf7; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: repeating-linear-gradient(90deg, transparent 0 28px, var(--bg-2) 28px 56px);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100%;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { text-align: center; margin-bottom: 20px; }
  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 3.4rem);
    letter-spacing: .02em;
    line-height: 1.05;
    margin: 0;
    color: var(--accent);
    text-shadow: 3px 3px 0 var(--gold);
    text-wrap: balance;
  }
  header p { margin: 8px 0 0; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .78rem; }

  .stage {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
    gap: 28px;
    align-items: start;
  }
  @media (max-width: 760px) { .stage { grid-template-columns: minmax(0, 1fr); } }

  .wheel-area { display: flex; flex-direction: column; align-items: center; gap: 18px; min-width: 0; }
  .wheel-box { position: relative; width: min(100%, 520px); aspect-ratio: 1; max-width: 100%; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: var(--shadow); }
  .pointer {
    position: absolute;
    top: -14px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 44px solid var(--accent);
    filter: drop-shadow(0 3px 2px rgba(0,0,0,.3));
    z-index: 2;
    transform-origin: 50% 20%;
  }
  .pointer::after {
    content: ""; position: absolute; top: -48px; left: -10px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--gold); border: 3px solid var(--panel);
  }
  .pointer.wobble { animation: wobble .12s ease-in-out; }
  @keyframes wobble { 0% { transform: translateX(-50%) rotate(0); } 50% { transform: translateX(-50%) rotate(-14deg); } 100% { transform: translateX(-50%) rotate(0); } }

  .spin-btn {
    font-family: var(--font-display);
    font-size: 1.35rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    background: var(--accent);
    color: var(--accent-fg);
    border: 0;
    border-bottom: 6px solid rgba(0,0,0,.28);
    border-radius: 999px;
    padding: 14px 44px;
    cursor: pointer;
    transition: transform .08s, border-bottom-width .08s;
  }
  .spin-btn:active:not(:disabled) { transform: translateY(4px); border-bottom-width: 2px; }
  .spin-btn:disabled { opacity: .55; cursor: wait; }
  .spin-btn:focus-visible, button:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  .result {
    width: min(100%, 520px);
    background: var(--panel);
    border: 2px dashed var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    text-align: center;
  }
  .result .eyebrow { font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 800; margin: 0 0 4px; }
  .result .pick { font-family: var(--font-display); font-size: clamp(1.4rem, 4.5vw, 2rem); margin: 0; line-height: 1.15; overflow-wrap: anywhere; }
  .result .pick.placeholder { color: var(--muted); font-family: var(--font-body); font-weight: 700; font-size: 1rem; }
  .result .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }

  .panel {
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    box-shadow: var(--shadow);
    min-width: 0;
  }
  .panel h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; margin: 0 0 4px; }
  .panel .hint { color: var(--muted); margin: 0 0 12px; font-size: .92rem; }
  textarea {
    width: 100%;
    min-height: 300px;
    resize: vertical;
    font: inherit;
    font-weight: 600;
    line-height: 1.7;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid var(--line);
    background: var(--bg);
    color: var(--fg);
  }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .btn {
    font: inherit; font-weight: 800;
    padding: 9px 16px;
    border-radius: 999px;
    border: 2px solid var(--line);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  .btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .count { color: var(--muted); font-size: .9rem; margin-left: auto; font-variant-numeric: tabular-nums; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: .92rem; color: var(--muted); font-weight: 700; margin-top: 14px; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

  .history { margin-top: 16px; border-top: 2px dashed var(--line); padding-top: 12px; }
  .history h3 { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .history ol { margin: 0; padding-left: 20px; font-weight: 600; }
  .history li { overflow-wrap: anywhere; }
  .history .empty { color: var(--muted); font-style: italic; }

  @media (prefers-reduced-motion: reduce) {
    .pointer.wobble { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Weekend Wheel</h1>
    <p>Step right up. Spin to decide.</p>
  </header>

  <div class="stage">
    <section class="wheel-area" aria-label="Spinning wheel">
      <div class="wheel-box">
        <div class="pointer" id="pointer" aria-hidden="true"></div>
        <canvas id="wheel" role="img" aria-label="Wheel of weekend activities"></canvas>
      </div>
      <button class="spin-btn" id="spin" type="button">Spin</button>
      <div class="result" aria-live="polite">
        <p class="eyebrow">This weekend you're doing</p>
        <p class="pick placeholder" id="pick">Hit Spin and let the wheel decide.</p>
        <div class="actions" id="resultActions" hidden>
          <button class="btn" id="removeWinner" type="button">Remove it from the wheel</button>
          <button class="btn" id="spinAgain" type="button">Spin again</button>
        </div>
      </div>
    </section>

    <aside class="panel" aria-label="Activity list">
      <h2>Your options</h2>
      <p class="hint">One activity per line. The wheel redraws as you type, and your list stays in this browser.</p>
      <textarea id="options" spellcheck="false" aria-label="Activities, one per line"></textarea>
      <div class="toolbar">
        <button class="btn" id="shuffle" type="button">Shuffle order</button>
        <button class="btn" id="reset" type="button">Restore examples</button>
        <span class="count" id="count"></span>
      </div>
      <label class="toggle"><input type="checkbox" id="sound" checked> Clicker sound</label>
      <label class="toggle"><input type="checkbox" id="autoRemove"> Remove each winner automatically</label>
      <div class="history">
        <h3>Spin history</h3>
        <ol id="history"><li class="empty">No spins yet.</li></ol>
      </div>
    </aside>
  </div>
</div>

<script>
(function () {
  var EXAMPLES = [
    "Morning hike", "Farmers market run", "Try a new brunch spot", "Bike ride by the water",
    "Movie marathon at home", "Day trip somewhere new", "Cook a big meal", "Board game night",
    "Museum or gallery", "Do absolutely nothing"
  ];
  var SEG_VARS = ["--seg-1","--seg-2","--seg-3","--seg-4","--seg-5","--seg-6","--seg-7","--seg-8"];
  var STORAGE_KEY = "weekend-wheel-options";

  var canvas = document.getElementById("wheel");
  var ctx = canvas.getContext("2d");
  var textarea = document.getElementById("options");
  var spinBtn = document.getElementById("spin");
  var pick = document.getElementById("pick");
  var actions = document.getElementById("resultActions");
  var removeBtn = document.getElementById("removeWinner");
  var againBtn = document.getElementById("spinAgain");
  var shuffleBtn = document.getElementById("shuffle");
  var resetBtn = document.getElementById("reset");
  var countEl = document.getElementById("count");
  var soundToggle = document.getElementById("sound");
  var autoRemove = document.getElementById("autoRemove");
  var historyEl = document.getElementById("history");
  var pointer = document.getElementById("pointer");

  var options = [];
  var rotation = 0;         // radians, current wheel rotation
  var spinning = false;
  var lastWinner = null;
  var history = [];
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function load() {
    var saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    textarea.value = saved !== null ? saved : EXAMPLES.join("\n");
    parse();
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, textarea.value); } catch (e) {}
  }
  function parse() {
    options = textarea.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    countEl.textContent = options.length + (options.length === 1 ? " option" : " options");
    spinBtn.disabled = options.length < 2 || spinning;
    draw();
  }

  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function draw() {
    var dpr = window.devicePixelRatio || 1;
    var size = canvas.clientWidth || 400;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);

    var cx = size / 2, cy = size / 2, r = size / 2 - 6;
    var n = options.length;
    var colors = SEG_VARS.map(cssVar);
    var rim = cssVar("--gold"), hub = cssVar("--hub"), fg = cssVar("--fg"), segText = cssVar("--seg-text");

    if (n === 0) {
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = hub; ctx.fill();
      ctx.fillStyle = fg; ctx.font = "700 " + Math.round(size / 22) + "px " + cssVar("--font-body");
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("Add some activities to the list", cx, cy);
      return;
    }

    var seg = (Math.PI * 2) / n;
    for (var i = 0; i < n; i++) {
      var start = rotation + i * seg, end = start + seg;
      // avoid same color on first and last wedge when n is a multiple of palette length +1
      var colorIdx = i % colors.length;
      if (i === n - 1 && colorIdx === 0 && n > 1) colorIdx = 1;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, end);
      ctx.closePath();
      ctx.fillStyle = colors[colorIdx];
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.55)";
      ctx.lineWidth = 2;
      ctx.stroke();

      // label, drawn along the radius
      ctx.save();
      ctx.translate(cx, cy);
      var mid = start + seg / 2;
      var norm = ((mid % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      var flip = norm > Math.PI / 2 && norm < Math.PI * 1.5; // left half: flip so text reads upright
      ctx.rotate(flip ? mid + Math.PI : mid);
      ctx.textAlign = flip ? "left" : "right";
      ctx.textBaseline = "middle";
      var maxW = r * 0.62;
      var fontSize = Math.max(11, Math.min(size / 20, (seg * r) * 0.5));
      ctx.font = "800 " + fontSize + "px " + cssVar("--font-body");
      var label = options[i];
      while (ctx.measureText(label).width > maxW && fontSize > 10) {
        fontSize -= 1;
        ctx.font = "800 " + fontSize + "px " + cssVar("--font-body");
      }
      if (ctx.measureText(label).width > maxW) {
        while (label.length > 1 && ctx.measureText(label + "…").width > maxW) label = label.slice(0, -1);
        label += "…";
      }
      ctx.fillStyle = segText;
      ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 3; ctx.shadowOffsetY = 1;
      ctx.fillText(label, flip ? -(r - 18) : r - 18, 0);
      ctx.restore();
    }

    // rim
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.lineWidth = 10; ctx.strokeStyle = rim; ctx.stroke();
    // rim bulbs
    var bulbs = Math.max(12, n * 2);
    for (var b = 0; b < bulbs; b++) {
      var a = rotation + (b / bulbs) * Math.PI * 2;
      ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 3.2, 0, Math.PI * 2);
      ctx.fillStyle = b % 2 ? "#fff8e1" : "#ffd36b"; ctx.fill();
    }
    // hub
    ctx.beginPath(); ctx.arc(cx, cy, Math.max(18, size * 0.07), 0, Math.PI * 2);
    ctx.fillStyle = hub; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = rim; ctx.stroke();
  }

  // ---- audio clicker ----
  var audioCtx = null;
  function tick() {
    if (!soundToggle.checked) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "square"; o.frequency.value = 900;
      g.gain.setValueAtTime(0.08, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.05);
    } catch (e) {}
  }
  function fanfare() {
    if (!soundToggle.checked || !audioCtx) return;
    try {
      [523, 659, 784, 1047].forEach(function (f, i) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "triangle"; o.frequency.value = f;
        var t = audioCtx.currentTime + i * 0.09;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + 0.4);
      });
    } catch (e) {}
  }

  // ---- spinning ----
  function winnerIndex(rot) {
    var n = options.length, seg = (Math.PI * 2) / n;
    // pointer sits at the top: angle -PI/2 in canvas space
    var a = (-Math.PI / 2 - rot) % (Math.PI * 2);
    if (a < 0) a += Math.PI * 2;
    return Math.floor(a / seg) % n;
  }

  function spin() {
    if (spinning || options.length < 2) return;
    spinning = true;
    spinBtn.disabled = true;
    actions.hidden = true;
    pick.classList.add("placeholder");
    pick.textContent = "Round and round it goes…";

    var n = options.length, seg = (Math.PI * 2) / n;
    var turns = reduceMotion ? 2 : 6 + Math.random() * 3;
    // pick a winner, then land the pointer inside that wedge, clear of the seams
    var idx = Math.floor(Math.random() * n);
    var pointerAngle = idx * seg + seg * (0.1 + Math.random() * 0.8);
    var target = ((-Math.PI / 2 - pointerAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    var start = rotation;
    var total = turns * Math.PI * 2 + ((target - (((start % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2))) + Math.PI * 2) % (Math.PI * 2);
    var duration = reduceMotion ? 1200 : 4800 + Math.random() * 1200;
    var t0 = performance.now();
    var lastSeg = Math.floor((-Math.PI / 2 - start) / seg);

    function frame(now) {
      var p = Math.min(1, (now - t0) / duration);
      var ease = 1 - Math.pow(1 - p, 3.2);
      rotation = start + total * ease;
      var curSeg = Math.floor((-Math.PI / 2 - rotation) / seg);
      if (curSeg !== lastSeg) {
        lastSeg = curSeg;
        tick();
        pointer.classList.remove("wobble");
        void pointer.offsetWidth;
        pointer.classList.add("wobble");
      }
      draw();
      if (p < 1) requestAnimationFrame(frame);
      else finish();
    }
    requestAnimationFrame(frame);
  }

  function finish() {
    rotation = rotation % (Math.PI * 2);
    spinning = false;
    var idx = winnerIndex(rotation);
    lastWinner = options[idx];
    pick.classList.remove("placeholder");
    pick.textContent = lastWinner;
    actions.hidden = false;
    fanfare();
    history.unshift(lastWinner);
    renderHistory();
    if (autoRemove.checked) removeWinner();
    spinBtn.disabled = options.length < 2;
  }

  function renderHistory() {
    historyEl.innerHTML = "";
    if (!history.length) {
      var li = document.createElement("li"); li.className = "empty"; li.textContent = "No spins yet.";
      historyEl.appendChild(li); return;
    }
    history.slice(0, 8).forEach(function (h) {
      var li = document.createElement("li"); li.textContent = h; historyEl.appendChild(li);
    });
  }

  function removeWinner() {
    if (lastWinner === null) return;
    var lines = textarea.value.split("\n");
    var removed = false;
    textarea.value = lines.filter(function (l) {
      if (!removed && l.trim() === lastWinner) { removed = true; return false; }
      return true;
    }).join("\n");
    save(); parse();
    removeBtn.disabled = true;
  }

  function shuffle() {
    var lines = textarea.value.split("\n").filter(function (l) { return l.trim(); });
    for (var i = lines.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = lines[i]; lines[i] = lines[j]; lines[j] = t;
    }
    textarea.value = lines.join("\n");
    save(); parse();
  }

  // ---- wiring ----
  spinBtn.addEventListener("click", spin);
  againBtn.addEventListener("click", spin);
  removeBtn.addEventListener("click", removeWinner);
  shuffleBtn.addEventListener("click", shuffle);
  resetBtn.addEventListener("click", function () { textarea.value = EXAMPLES.join("\n"); save(); parse(); });
  textarea.addEventListener("input", function () { save(); parse(); });
  againBtn.addEventListener("click", function () { removeBtn.disabled = false; });
  spinBtn.addEventListener("click", function () { removeBtn.disabled = false; });
  canvas.addEventListener("click", spin);
  window.addEventListener("resize", draw);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

  load();
})();
</script>
</body>
</html>
